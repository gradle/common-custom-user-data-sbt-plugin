name: Verify Build

on: [ push, pull_request, workflow_dispatch ]

permissions:
  contents: read
  id-token: write

jobs:
  verification:
    name: Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up JDK 8
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '8'
          distribution: 'temurin'
      - name: Setup sbt installer
        uses: sbt/setup-sbt@ecad189dd245444b9ae0a0cd5922fd938b88906f # v1.5.12
        with:
          # Keep the 1.x runner to preserve JDK 8 testing
          sbt-runner-version: 1.12.13
      - name: Get GitHub OIDC token for Develocity
        id: develocity-oidc
        shell: bash
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::warning::No GitHub OIDC token available (e.g. PR from a fork), Develocity will not be authenticated"
            exit 0
          fi
          token=$(curl -sSfG -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --data-urlencode "audience=https://ge.solutions-team.gradle.com" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          echo "::add-mask::$token"
          # Exchange the OIDC token for a short-lived Develocity access token, for builds that read DEVELOCITY_ACCESS_KEY directly
          access_token=$(curl -sSf --retry 3 -X POST -H "Authorization: Bearer $token" \
            "https://ge.solutions-team.gradle.com/api/auth/token?expiresInHours=2")
          echo "::add-mask::$access_token"
          echo "token-access-key=ge.solutions-team.gradle.com=$access_token" >> "$GITHUB_OUTPUT"
      - name: Build and publish to M2 with sbt
        run: sbt scalafmtCheckAll clean test scripted publishM2
        env:
          DEVELOCITY_ACCESS_KEY: ${{ steps.develocity-oidc.outputs.token-access-key }}
      - name: Upload published plugin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbt-develocity-common-custom-user-data
          path: ~/.m2/repository/com/gradle

  local-test:
    name: Test with Locally Published Plugin
    runs-on: ubuntu-latest
    needs: verification
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up JDK 8
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '8'
          distribution: 'temurin'
      - name: Setup sbt installer
        uses: sbt/setup-sbt@ecad189dd245444b9ae0a0cd5922fd938b88906f # v1.5.12
        with:
          # Keep the 1.x runner to preserve JDK 8 testing
          sbt-runner-version: 1.12.13
      - name: Download plugin to maven local
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sbt-develocity-common-custom-user-data
          path: ~/.m2/repository/com/gradle
      - name: Create a test project
        run: |
          mkdir -p ${{ runner.temp }}/ccud-sbt-integration-test/project

          # Match the plugin's sbt version
          cp project/build.properties ${{ runner.temp }}/ccud-sbt-integration-test/project/build.properties

          echo """resolvers += Resolver.mavenLocal
            addSbtPlugin(\"com.gradle\" % \"sbt-develocity\" % \"1+\")
            addSbtPlugin(\"com.gradle\" % \"sbt-develocity-common-custom-user-data\" % \"1+\")
          """ > ${{ runner.temp }}/ccud-sbt-integration-test/project/plugins.sbt

          echo """ThisBuild / scalaVersion := \"2.12.15\"
            ThisBuild / organization := \"com.gradle\"

            ThisBuild / develocityConfiguration ~= { prev =>
              prev
                .withServer(
                  prev.server.withUrl(Some(url(\"https://ge.solutions-team.gradle.com\")))
                )
                .withBuildScan(
                  prev.buildScan
                    .withObfuscation(prev.buildScan.obfuscation.withIpAddresses(_.map(_ => \"0.0.0.0\")))
                    .withBackgroundUpload(!sys.env.contains(\"CI\"))
                )
              }
          """ > ${{ runner.temp }}/ccud-sbt-integration-test/build.sbt
      - name: Get GitHub OIDC token for Develocity
        id: develocity-oidc
        shell: bash
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::warning::No GitHub OIDC token available (e.g. PR from a fork), Develocity will not be authenticated"
            exit 0
          fi
          token=$(curl -sSfG -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --data-urlencode "audience=https://ge.solutions-team.gradle.com" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          echo "::add-mask::$token"
          # Exchange the OIDC token for a short-lived Develocity access token, for builds that read DEVELOCITY_ACCESS_KEY directly
          access_token=$(curl -sSf --retry 3 -X POST -H "Authorization: Bearer $token" \
            "https://ge.solutions-team.gradle.com/api/auth/token?expiresInHours=2")
          echo "::add-mask::$access_token"
          echo "token-access-key=ge.solutions-team.gradle.com=$access_token" >> "$GITHUB_OUTPUT"
      - name: Run a build with the locally published plugin
        id: build-with-local-plugin
        run: sbt clean
        working-directory: ${{ runner.temp }}/ccud-sbt-integration-test
        env:
          DEVELOCITY_ACCESS_KEY: ${{ steps.develocity-oidc.outputs.token-access-key }}
